packages:
  - 'apps/**'
  - 'packages/**'

allowBuilds:
  '@fortawesome/fontawesome-common-types': true
  '@fortawesome/fontawesome-svg-core': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  cwebp-bin: true
  esbuild: true
  gifsicle: true
  iltorb: true
  mozjpeg: true
  pngquant-bin: true
  secp256k1: true
  unrs-resolver: true

minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - '@types/*'
  - '@secretlint/*'
  - 'secretlint'
